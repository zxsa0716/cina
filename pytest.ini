[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --color=yes
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
markers =
    slow: tests that take > 1 second
    network: tests that require network access (skipped by default)
    llm: tests that require LLM API keys (skipped by default)

# CINA v9 CI — pytest + build artefact freshness check
# Install: move this file to .github/workflows/cina_v9_ci.yml (needs PAT with workflow scope)

name: CINA v9 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy
          # sentence-transformers heavy; skip in CI unless --slow
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run pytest (fast path)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pytest tests/ -v -m "not slow and not network and not llm" --tb=short

  build-freshness:
    name: Build artefacts freshness check
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Check rebuild_if_stale
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -e
          if python -m src.data.rebuild_if_stale --check; then
            echo "✅ All build artefacts FRESH"
          else
            echo "⚠️ Some build artefacts STALE — see report"
            python -m src.data.rebuild_if_stale --check || true
            # Don't fail the build — STALE is informational only
          fi

  reproducibility:
    name: Reproducibility certificate
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install numpy

      - name: Generate reproducibility certificate
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m src.data.build_reproducibility_certificate
          cat data/reproducibility_certificate.md || true

      - name: Upload certificate artifact
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-certificate
          path: |
            data/reproducibility_certificate.json
            data/reproducibility_certificate.md
          retention-days: 90

  corpus-integrity:
    name: Corpus integrity (sha256 manifest verify)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify corpus manifest sha256
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -c "
          import hashlib, json, sys
          from pathlib import Path
          manifest_path = Path('data/corpus/manifest.jsonl')
          if not manifest_path.exists():
              print('No manifest yet; skipping')
              sys.exit(0)
          errs = 0
          with manifest_path.open() as f:
              for line in f:
                  rec = json.loads(line)
                  p = Path(rec['path'])
                  if not p.exists():
                      print(f'⚠️ missing: {rec[\"path\"]}')
                      continue
                  actual = hashlib.sha256(p.read_bytes()).hexdigest()
                  expected = rec.get('sha256', '')
                  if actual != expected:
                      print(f'❌ sha256 mismatch: {rec[\"path\"]}')
                      print(f'  expected: {expected[:16]}...')
                      print(f'  actual:   {actual[:16]}...')
                      errs += 1
                  else:
                      print(f'✅ {rec[\"path\"]}')
          sys.exit(1 if errs > 0 else 0)
          "
